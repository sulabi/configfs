[package]
name = "configfs"
version = "0.2.0"
edition = "2024"
description = "A simple application configuration manager"
readme = "README.md"
repository = "https://github.com/sulabi/configfs"
license = "MIT or Apache-2.0"
keywords = ["toml"]
categories = ["config", "filesystem"]

[[example]]
name = "watcher"
required-features = ["watcher"]

[[example]]
name = "system-dirs"
required-features = ["system-dirs"]

[dependencies]
dirs = { version = "6.0.0", optional = true }
notify = { version = "8.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook", "run-cargo-clippy", "run-cargo-fmt", "run-cargo-test"]

[features]
system-dirs = ["dep:dirs"]
watcher = ["dep:notify"]
